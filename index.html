<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班级手机端动态报告</title>
<style>
:root { --ink:#101827; --muted:#63748a; --blue:#0d4e73; --cyan:#28d7ff; --paper:#f8fbff; --line:#c9d8e8; --good:#13a36b; --bad:#d1433d; --warn:#c87613; --font:16px; }
* { box-sizing:border-box; }
body { margin:0; font-family:"PingFang SC","Microsoft YaHei",sans-serif; font-size:var(--font); background:
  radial-gradient(circle at 20% -8%, rgba(40,215,255,.26), transparent 32%),
  radial-gradient(circle at 90% 0%, rgba(124,92,255,.22), transparent 30%),
  linear-gradient(180deg,#07111f 0,#0b1e35 260px,#eaf2f8 261px,#f5f8fc 100%);
  color:var(--ink); }
.login { min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(135deg,#17475f,#7b6039); }
.login-card { width:min(420px,100%); background:rgba(248,251,255,.96); border:1px solid rgba(40,215,255,.22); border-radius:18px; padding:24px; box-shadow:0 24px 70px rgba(0,0,0,.25); }
.login-card h1 { margin:0 0 8px; font-size:1.45rem; }
.login-card input { width:100%; height:46px; margin:8px 0; border:1px solid var(--line); border-radius:12px; padding:0 12px; font-size:1rem; background:white; }
button { border:0; border-radius:999px; padding:10px 14px; background:linear-gradient(135deg,#0d4e73,#087ea4); color:white; font-weight:800; box-shadow:0 10px 22px rgba(8,78,115,.22); }
.error { color:var(--bad); min-height:24px; }
#report { display:none; }
header { position:relative; overflow:hidden; color:white; min-height:270px; padding:26px 18px 104px; background:
  radial-gradient(circle at 8% 10%, rgba(40,215,255,.26), transparent 28%),
  radial-gradient(circle at 76% 22%, rgba(124,92,255,.24), transparent 30%),
  linear-gradient(135deg,rgba(7,17,31,.98),rgba(12,76,110,.94) 54%,rgba(27,47,86,.92)),
  repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 1px,transparent 1px 22px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 22px); }
header:before { content:""; position:absolute; right:-86px; top:-110px; width:270px; height:270px; border-radius:50%; border:1px solid rgba(40,215,255,.28); box-shadow:0 0 0 38px rgba(255,255,255,.035), inset 0 0 40px rgba(40,215,255,.08); }
header:after { content:""; position:absolute; left:18px; bottom:68px; width:126px; height:4px; border-radius:999px; background:linear-gradient(90deg,#28d7ff,#8b5cf6,#f6c45f); box-shadow:0 0 18px rgba(40,215,255,.55); }
header h1 { position:relative; margin:0 0 10px; font-size:1.88rem; letter-spacing:.01em; line-height:1.18; text-shadow:0 12px 28px rgba(0,0,0,.28); }
header p { position:relative; margin:0; color:rgba(255,255,255,.88); font-weight:700; }
.hero-chips { position:relative; display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
.hero-chips span { border:1px solid rgba(40,215,255,.26); background:rgba(255,255,255,.12); color:white; border-radius:999px; padding:7px 11px; font-size:.86rem; backdrop-filter:blur(8px); box-shadow:inset 0 0 18px rgba(40,215,255,.08); }
.tools { position:fixed; left:12px; right:12px; bottom:12px; z-index:12; display:flex; gap:8px; justify-content:space-between; padding:8px; background:rgba(7,17,31,.88); backdrop-filter:blur(14px); border:1px solid rgba(40,215,255,.24); border-radius:999px; box-shadow:0 18px 45px rgba(2,8,23,.32); }
.tools div { display:flex; gap:8px; }
.tools button { background:rgba(40,215,255,.14); border:1px solid rgba(255,255,255,.18); box-shadow:none; }
main { margin-top:-58px; padding:0 10px 96px; max-width:760px; margin-left:auto; margin-right:auto; position:relative; z-index:2; }
section,.card { background:rgba(248,251,255,.97); border:1px solid var(--line); border-radius:18px; padding:16px; margin:12px 0; box-shadow:0 18px 42px rgba(15,23,42,.12); }
section h2 { margin-top:0; padding-top:2px; }
.metric-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.metric { border:1px solid rgba(40,215,255,.20); border-radius:14px; padding:12px; background:linear-gradient(180deg,#ffffff,#eef8ff); box-shadow:inset 0 1px 0 rgba(255,255,255,.9); }
.metric b { display:block; font-size:1.45rem; color:var(--blue); }
.metric span { color:var(--muted); }
.subject-grid { display:grid; gap:10px; }
.subject-card { border:1px solid var(--line); border-radius:14px; padding:12px; background:linear-gradient(180deg,#ffffff,#f4f9ff); }
.subject-card div { display:flex; justify-content:space-between; gap:12px; }
.subject-card.good span { color:var(--good); font-weight:800; }
.subject-card.bad span { color:var(--bad); font-weight:800; }
.subject-card p { margin:4px 0 0; color:var(--muted); line-height:1.5; }
.spark { width:100%; height:54px; margin:6px 0; }
.table-scroll { overflow-x:auto; }
table { width:100%; border-collapse:separate; border-spacing:0; font-size:var(--font); }
th,td { white-space:nowrap; padding:9px 10px; border-bottom:1px solid #dfe8f2; text-align:left; }
th { background:#e7f6fb; color:#123f58; }
.overview-table th,.overview-table td { text-align:center; }
.overview-table th:first-child,.overview-table td:first-child { text-align:left; }
.good { color:var(--good); font-weight:800; } .bad { color:var(--bad); font-weight:800; } .warn { color:var(--warn); font-weight:800; }
.hint { color:var(--muted); line-height:1.6; }
</style>
</head>
<body>
<div class="login" id="login">
  <div class="login-card">
    <h1>班级动态报告</h1>
    <p class="hint">请输入班级和短密码查看本班数据。</p>
    <input id="user" autocomplete="username" placeholder="班级，例如 701">
    <input id="pwd" autocomplete="current-password" type="password" placeholder="短密码">
    <button id="loginBtn">进入报告</button>
    <p class="error" id="error"></p>
  </div>
</div>
<div id="report">
<header><h1 id="title"></h1><p>2025-1期中 → 2025-1期末 → 2025-2期中</p><div class="hero-chips"><span>班级专属</span><span>三次追踪</span><span>手机查看</span></div></header>
<div class="tools"><button id="logout">退出</button><div><button data-font="-1">A-</button><button data-font="1">A+</button></div></div>
<main id="content"></main>
</div>

const DATA = JSON.parse(document.getElementById('payload').textContent);
function fmt(value, digits=2) {
  if (value === null || value === undefined || value === '') return '—';
  if (typeof value === 'number') return value.toFixed(digits);
  return String(value);
}
function fmtByHeader(value, header) {
  if (value === null || value === undefined || value === '') return '—';
  if (typeof value !== 'number') return String(value);
  if (header.includes('名次') || header.includes('次数')) return String(Math.round(value));
  if (header === '考试' || header === '学科' || header === '动态判断' || header === '综合判断' || header === '帮扶后判断') return String(value);
  return value.toFixed(2);
}
function clsFor(text) {
  text = String(text || '');
  if (text.includes('进步') || text.includes('改善') || text.includes('提升')) return 'good';
  if (text.includes('退步') || text.includes('下滑') || text.includes('恶化') || text.includes('下降')) return 'bad';
  if (text.includes('警戒') || text.includes('新增') || text.includes('反复')) return 'warn';
  return '';
}
function table(headers, rows) {
  if (!rows.length) return '<p class="hint">暂无记录。</p>';
  const tableClass = headers.includes('考试') && headers.includes('Z分名次') ? 'overview-table' : '';
  return `<div class="table-scroll"><table class="${tableClass}"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${headers.map(h=>`<td class="${clsFor(row[h])}">${fmtByHeader(row[h], h)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function spark(values) {
  const valid = values.filter(v => typeof v === 'number');
  if (!valid.length) return '';
  let lo = Math.min(...valid), hi = Math.max(...valid);
  if (Math.abs(hi - lo) < 0.001) { lo -= 1; hi += 1; }
  const pts = values.map((v,i) => {
    const x = 8 + i * 52;
    const y = typeof v === 'number' ? 44 - ((v - lo) / (hi - lo)) * 34 : 26;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const color = values.at(-1) >= values[0] ? '#147a52' : '#b33a32';
  return `<svg class="spark" viewBox="0 0 120 52"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="${color}" />`).join('')}</svg>`;
}
async function digest(text) {
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function render(cls) {
  const record = DATA.classes[cls];
  const s = record.summary;
  document.getElementById('title').textContent = `${cls}班三次考试动态报告`;
  const subjectCards = record.subjects.map(row => `<article class="subject-card ${clsFor(row.动态判断)}"><div><b>${row.学科}</b><span>${row.动态判断}</span></div>${spark([row['2025-1期中_Z分'], row['2025-1期末_Z分'], row['2025-2期中_Z分']])}<p>${row.判断依据 || ''}</p></article>`).join('');
  document.getElementById('content').innerHTML = `
  <section><h2>班级总览</h2><div class="metric-grid">
    <div class="metric"><b>${fmt(s.Z分总变化)}</b><span>总分Z变化</span></div>
    <div class="metric"><b>${fmt(s.名次总变化,0)}</b><span>总分名次变化</span></div>
    <div class="metric"><b>${s.动态判断 || '—'}</b><span>整体判断</span></div>
    <div class="metric"><b>${fmt(s.均差总变化)}</b><span>总分均差变化</span></div>
  </div><p class="hint">${s.判断依据 || ''}</p>${spark([s['2025-1期中_Z分'], s['2025-1期末_Z分'], s['2025-2期中_Z分']])}
  <h3>三次考试总分表现</h3>
  ${table(['考试','Z分','Z分名次'], [
    {考试:'2025-1期中', Z分:s['2025-1期中_Z分'], Z分名次:s['2025-1期中_Z分名次']},
    {考试:'2025-1期末', Z分:s['2025-1期末_Z分'], Z分名次:s['2025-1期末_Z分名次']},
    {考试:'2025-2期中', Z分:s['2025-2期中_Z分'], Z分名次:s['2025-2期中_Z分名次']}
  ])}</section>
  <section><h2>学科动态卡片</h2><div class="subject-grid">${subjectCards}</div></section>
  <section><h2>学科班级进退步明细</h2>${table(['学科','2025-1期中_Z分','2025-1期末_Z分','2025-2期中_Z分','Z分总变化','均差总变化','名次总变化','动态判断','判断依据'], record.subjects)}</section>
  <section><h2>重点变化</h2>${table(['学科','动态判断','Z分总变化','均差总变化','名次总变化','判断依据'], record.keyChanges)}</section>
  <section><h2>警戒与薄弱动态</h2>${table(['学科','出现次数','动态状态','Z分总变化','均差总变化','综合判断'], record.warnings)}</section>
  ${record.helps.length ? `<section><h2>帮扶提升动态</h2>${table(['班级','学科','名单期末均差','2025-2期中_均差','均差变化_期末到下期中','Z分变化_期末到下期中','帮扶后判断'], record.helps.map(row => ({...row, 班级: cls})))}</section>` : ''}`;
}
document.getElementById('loginBtn').addEventListener('click', async () => {
  const user = document.getElementById('user').value.trim();
  const pwd = document.getElementById('pwd').value.trim();
  if (DATA.accounts[user] && await digest(pwd) === DATA.accounts[user]) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('report').style.display = 'block';
    render(user);
  } else {
    document.getElementById('error').textContent = '班级或密码不正确';
  }
});
document.getElementById('logout').addEventListener('click', () => location.reload());
let fontSize = 16;
document.querySelectorAll('[data-font]').forEach(button => button.addEventListener('click', () => {
  fontSize = Math.min(22, Math.max(14, fontSize + Number(button.dataset.font)));
  document.documentElement.style.setProperty('--font', fontSize + 'px');
}));
</script>
</body>
</html>
